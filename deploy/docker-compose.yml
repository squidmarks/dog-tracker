# Runs on `home`. Create the broker password file first:
#   docker run --rm -v $PWD:/w eclipse-mosquitto mosquitto_passwd -c -b /w/passwd meshtastic <password>
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

  server:
    build: { context: .., dockerfile: deploy/Dockerfile.server }
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: ${MQTT_USER:-meshtastic}
      MQTT_PASS: ${MQTT_PASS:?set MQTT_PASS}
      CHANNEL_PSK: ${CHANNEL_PSK:?set CHANNEL_PSK}
      MONGO_URL: mongodb://${MONGO_USER:?set MONGO_USER}:${MONGO_PASSWORD:?set MONGO_PASSWORD}@mongo-mongo-1:27017/?authSource=admin
      MONGO_DB: dogtracker
      YARD_LAT: ${YARD_LAT:-}
      YARD_LON: ${YARD_LON:-}
      YARD_RADIUS_M: ${YARD_RADIUS_M:-40}
      SIM_DOGS: ${SIM_DOGS:-0}
      SIM_TICK_S: ${SIM_TICK_S:-15}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    networks: [default, platform]   # `platform` is the shared network the home Mongo lives on
    depends_on: [mosquitto]

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    environment:
      API_URL: http://server:4000
    ports: ["127.0.0.1:3800:3000"]   # Caddy on the host fronts this
    depends_on: [server]

volumes:
  mosquitto-data:

networks:
  platform:
    external: true
