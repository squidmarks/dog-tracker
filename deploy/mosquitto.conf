persistence true
persistence_location /mosquitto/data/
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Also publish the broker's own log as MQTT messages (under $SYS/broker/log/...). The tracker server reads the
# "New client connected" / "Client ... disconnected" lines to know the instant a LoRa hub goes offline.
log_dest stderr
log_dest topic
log_type notice
log_type warning
log_type error
